[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathlatex-ocr"
version = "0.1.0"
description = "Offline screenshot-to-LaTeX desktop application using ONNX Runtime"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MathLaTeX contributors" }]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.18,<2",
  "Pillow>=10,<13",
  "tokenizers>=0.19,<1",
]

[project.optional-dependencies]
dev = [
  "onnx>=1.16,<2",
  "pyinstaller>=6.10,<7",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
mathlatex = "mathlatex_app.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
